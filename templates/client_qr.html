<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Download Client QR | Beanthentic</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ asset_version }}" />
  <style>
    .client-qr-page {
      max-width: 520px;
      margin: 0 auto;
      padding: 28px 18px 48px;
      text-align: center;
    }

    .client-qr-card {
      background: #f4faf3;
      border: 1px solid #d8e8d6;
      border-radius: 18px;
      padding: 24px 20px 28px;
      box-shadow: 0 10px 28px rgba(30, 98, 22, 0.08);
    }

    .client-qr-card h1 {
      margin: 0 0 8px;
      color: #1e6216;
      font-size: clamp(1.35rem, 5vw, 1.75rem);
    }

    .client-qr-card p {
      margin: 0 0 18px;
      color: #4a5a4c;
      line-height: 1.5;
    }

    .client-qr-url {
      display: inline-block;
      margin-bottom: 18px;
      padding: 10px 14px;
      border-radius: 10px;
      background: #ffffff;
      border: 1px solid #c5dcc0;
      color: #1e6216;
      font-weight: 700;
      word-break: break-all;
    }

    .client-qr-preview {
      width: min(100%, 360px);
      height: auto;
      border-radius: 12px;
      margin: 0 auto 20px;
      display: block;
      border: 1px solid #d8e8d6;
      background: #ffffff;
    }

    .client-qr-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: stretch;
    }

    .client-qr-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 12px 18px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(180deg, #2b7f1f 0%, #1e6216 100%);
      color: #ffffff;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 8px 18px rgba(30, 98, 22, 0.22);
    }

    .client-qr-btn--secondary {
      background: #ffffff;
      color: #1e6216;
      border: 2px solid #1e6216;
      box-shadow: none;
    }

    .client-qr-note {
      margin-top: 18px;
      font-size: 0.92rem;
      color: #6a7a6c;
      line-height: 1.45;
    }

    .client-qr-back {
      display: inline-block;
      margin-top: 22px;
      color: #1e6216;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <main class="client-qr-page">
    <div class="client-qr-card">
      <h1>Beanthentic Client Web QR</h1>
      <p>Download the QR code, then scan it on your phone to open the client website.</p>
      <div class="client-qr-url">{{ client_url }}</div>
      <img
        class="client-qr-preview"
        src="{{ preview_url }}"
        alt="Beanthentic Client Web QR code"
      />
      <div class="client-qr-actions">
        <a class="client-qr-btn" href="{{ download_plain_url }}">Download QR image</a>
        <a class="client-qr-btn client-qr-btn--secondary" href="{{ download_print_url }}">Download QR with title</a>
      </div>
      <p class="client-qr-note">
        Phone and laptop must use the same home Wi-Fi. Run the server first, then scan the QR.
      </p>
    </div>
    <a class="client-qr-back" href="{{ url_for('home') }}">Back to homepage</a>
  </main>
</body>

</html>
