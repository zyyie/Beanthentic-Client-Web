<div
  class="header-notif-backdrop"
  id="notif-backdrop"
  hidden
  aria-hidden="true"
></div>
<div
  class="header-notif-panel"
  id="notif-panel"
  role="region"
  aria-label="Notifications"
  hidden
>
  <div class="header-notif-panel-head">
    <h3>Notifications</h3>
    <button type="button" class="header-notif-mark-read" data-notif-mark-read>
      Mark all as read
    </button>
  </div>
  <ul class="header-notif-list" data-notif-list></ul>
  <p class="header-notif-empty" data-notif-empty hidden>No notifications yet</p>
</div>
